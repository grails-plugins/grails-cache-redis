asciidoctor {
    resources {
        from('src/docs/images')
        into "./images"
    }

    attributes 'experimental': 'true',
            'compat-mode': 'true',
            'toc': 'left',
            'icons': 'font',
            'version': project.version,
            'sourcedir': "/src/main/groovy"
}

tasks.register('docs') { dependsOn asciidoctor }

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}